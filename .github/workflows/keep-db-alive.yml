name: Keep database alive

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint (touches the DB)
        run: |
          status=$(curl -s -o /tmp/health.json -w "%{http_code}" https://xoksis-website-backend-two.vercel.app/api/health)
          cat /tmp/health.json
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
